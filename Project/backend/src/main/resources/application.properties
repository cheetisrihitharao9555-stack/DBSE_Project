spring.application.name=crm-backend
server.port=${SERVER_PORT:8080}

# Optional .env file (see .env.example). Works whether you start the app from
# the project root or from the backend/ folder. Real OS environment variables win.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crm_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
# "none" in Phase 1 (there are no entities yet). From Phase 2 on the schema is
# managed by database/schema.sql and Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- CORS: comma-separated list of allowed frontend origins ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}



# ---- JWT ----
jwt.secret=${JWT_SECRET}

# ---- Never leak internals in error responses ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

